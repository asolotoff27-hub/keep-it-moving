<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep It Moving.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--in:#1d4ed8;--hl:#fef9c3;
--Push:#c2410c;--Pull:#1d4ed8;--Abs:#047857;--Legs:#6d28d9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1018;--card:#161d2b;--ink:#f3f4f6;--mute:#9ca3af;--line:#263044;--in:#7aa2ff;--hl:#3a3510}}
:root[data-theme=dark]{--bg:#0b1018;--card:#161d2b;--ink:#f3f4f6;--mute:#9ca3af;--line:#263044;--in:#7aa2ff;--hl:#3a3510}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
header{background:#111827;color:#fff;padding:14px 16px 0}
h1{margin:0;font:700 30px 'Barlow Condensed',Impact,sans-serif;letter-spacing:.5px}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:0 0 auto;background:none;border:0;color:#9ca3af;font:600 15px Barlow,sans-serif;padding:10px 16px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:#fff}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick button.arr{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
input[type=date],select{font:600 15px Barlow,sans-serif;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--hl);color:var(--ink);min-height:38px}
.dlabel{width:100%;font:600 20px 'Barlow Condensed',sans-serif;margin-top:2px}
.pills{display:flex;gap:6px;margin-top:10px}
.pills button{flex:1;padding:10px 4px;border-radius:8px;border:2px solid var(--c);background:var(--card);color:var(--c);font:700 15px Barlow,sans-serif;cursor:pointer}
.pills button.on{background:var(--c);color:#fff}
.band{display:flex;justify-content:space-between;align-items:center;background:var(--c);color:#fff;border-radius:10px 10px 0 0;padding:10px 14px;font:700 19px 'Barlow Condensed',sans-serif}
.band span{font:600 13px Barlow,sans-serif}
.ex{background:var(--card);border:1px solid var(--line);border-top:0;padding:10px 12px}
.ex:last-child{border-radius:0 0 10px 10px}
.ex h3{margin:0 0 6px;font:600 15px Barlow,sans-serif}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set label{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}
.set div{display:flex;gap:4px}
input.t{width:100%;min-width:0;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--in);font:600 15px Barlow,sans-serif}
input.t::placeholder{color:var(--mute);opacity:.55;font-weight:400}
input.t:focus,input.note:focus{outline:2px solid var(--c);background:var(--card)}
input.note{width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--in);font:14px Barlow,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--c,var(--ink));border-radius:8px;padding:8px;text-align:center}
.tile b{display:block;font:700 30px 'Barlow Condensed',sans-serif;color:var(--c,var(--ink))}
.tile i{font-style:normal;font-size:12px;color:var(--mute)}
h2{margin:0 0 8px;font:700 20px 'Barlow Condensed',sans-serif}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;font-size:11px;text-align:center;color:var(--mute)}
.bars em{display:block;border-radius:2px 2px 0 0;font-style:normal}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-size:11px;color:var(--mute);font-weight:600;text-align:right;padding:4px 8px}
td{padding:6px 8px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
.up{color:#047857;font-weight:700}.dn{color:#dc2626;font-weight:700}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);padding:20px 8px;text-align:center}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
</style></head><body>
<header><h1>KEEP IT MOVING.</h1>
<nav><button id="tLog" class="on">Log</button><button id="tYr">Year Review</button></nav></header>
<main id="app"></main>
<script>
const R=(s,n)=>Array(n).fill(s);
const PL={
Push:[["Bench Press",...R("125 8–10",2)],["Cable Side Delt Raises",...R("12.5 10–12",3)],["Incline Dumbbell Press",...R("55 6–8",2)],["Shoulder Press",...R("120 8–10",2)],["Tricep Pushdowns",...R("42.5 10–12",2)],["Overhead Cable Tricep Extension",...R("34 10–12",2)],["Chest Flys",...R("165 8–10",2)]],
Pull:[["Bent-Over Barbell Rows",...R("105 8–10",2)],["Lat Pulldown (Medium Handle)","120 10–12","115 10–12"],["Back Extensions",...R("35 12–15",2)],["Chest Supported Machine Row",...R("110 10–12",2)],["Rear Delt Cable Fly","10.5 12–15","7.5 12–15","7.5 12–15"],["Dumbbell Shrugs",...R("60 12–15",2)],["Rope Hammer Curls (Day A)",...R("47.5 8–10",2)],["Bayesian Cable Curl (Day A)","27.5 8–10","22.5 8–10"],["Preacher Curl (Day B)",...R("30 8–10",2)],["Rope Hammer Curls (Day B)",...R("47.5 8–10",2)]],
Abs:[["Cable Crunches",...R("72.5 12–15",3)],["Hip Adductors",...R("22.5 8–10",2)],["Dragon Flags / Leg Raises",...R("0 12–15",3)],["Decline Crunches",...R("7.5 15–20",3)]],
Legs:[["Bulgarian Split Squats (Dumbbell)",...R("55 8–10",2)],["Bulgarian Split Squats (Smith Machine)","108 8–10","113 8–10"],["Seated Hamstring Curls (Day A)","115 8–10","110 8–10"],["Lying Hamstring Curls (Day B)","90 8–10","95 8–10"],["Leg Extensions",...R("135 8–10",2)],["Romanian Deadlifts (RDL)",...R("150 10–12",2)],["Standing Calf Raises",...R("138 15–20",3)]]};
const SP=Object.keys(PL),MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],$=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let S={logs:{}},cur={d:iso(new Date()),sp:'Push'},tab='log',yr=new Date().getFullYear(),exSel='Bench Press',ref=null,timer=null,syncMsg='';
try{const l=JSON.parse(localStorage.getItem('kim')||'null');if(l&&l.logs)S=l}catch(e){}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem('kim',JSON.stringify(S))}catch(e){}
 if(ref)ref.set({json:JSON.stringify(S)}).then(()=>{syncMsg='Saved';tick()},()=>{syncMsg='Saved on this device only';tick()})},500)}
function tick(){const e=$('.sync');if(e)e.textContent=syncMsg}
const logged=(d,sp)=>Object.values(((S.logs[d]||{})[sp])||{}).some(e=>e.w&&e.w[0]!=='');
function put(n,k,i,v){const e=(((S.logs[cur.d]??={})[cur.sp]??={})[n]??={w:['','',''],r:['','',''],n:''});k==='n'?e.n=v:e[k][i]=v}
function setDay(d){cur.d=d;render()}
function shift(n){const d=new Date(cur.d+'T12:00');d.setDate(d.getDate()+n);setDay(iso(d))}
function renderLog(){
 const day=(S.logs[cur.d]||{})[cur.sp]||{},c=`var(--${cur.sp})`;
 const lab=new Date(cur.d+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const rows=PL[cur.sp].map(([n,...st])=>{const e=day[n]||{w:[],r:[],n:''};
  const cells=[0,1,2].map(i=>{const p=(st[i]||'').split(' ');
   return `<div class=set><label>Set ${i+1}</label><div><input class=t inputmode=decimal data-n="${esc(n)}" data-k=w data-i=${i} value="${esc(e.w[i]??'')}" placeholder="${p[0]||''}"><input class=t data-n="${esc(n)}" data-k=r data-i=${i} value="${esc(e.r[i]??'')}" placeholder="${p[1]||''}"></div></div>`}).join('');
  return `<div class=ex><h3>${n}</h3><div class=sets>${cells}</div><input class=note data-n="${esc(n)}" data-k=n placeholder="Notes" value="${esc(e.n||'')}"></div>`}).join('');
 return `<div class=card><div class=pick><button class=arr id=pv aria-label="Previous day">‹</button><input type=date id=dt value="${cur.d}"><button class=arr id=nx aria-label="Next day">›</button><button class=arr id=td style="width:auto;padding:0 12px;font:600 14px Barlow">Today</button><div class=dlabel>${lab}</div></div>
 <div class=pills>${SP.map(s=>`<button style="--c:var(--${s})" class="${s===cur.sp?'on':''}" data-sp=${s}>${s}</button>`).join('')}</div></div>
 <div style="--c:${c}"><div class=band>${cur.sp}<span id=st>${logged(cur.d,cur.sp)?'✔ Logged':'Not logged yet'}</span></div>${rows}</div><div class=sync>${syncMsg||'Gray numbers are your plan. Type over them. Everything saves by itself.'}</div>`}
function data(){const out=[];for(const d in S.logs)if(d.slice(0,4)==yr)for(const sp in S.logs[d])for(const n in S.logs[d][sp]){const e=S.logs[d][sp][n];
 if(e.w&&e.w[0]!==''&&!isNaN(+e.w[0]))out.push({d,sp,n,w:+e.w[0],mx:Math.max(...e.w.filter(x=>x!==''&&!isNaN(+x)).map(Number))})}return out.sort((a,b)=>a.d<b.d?-1:1)}
function renderYr(){
 const D=data(),ses={},mo=MN.map(()=>({Push:0,Pull:0,Abs:0,Legs:0}));
 D.forEach(x=>{const k=x.d+x.sp;if(!ses[k]){ses[k]=1;mo[+x.d.slice(5,7)-1][x.sp]++}});
 const tot=SP.map(s=>mo.reduce((a,m)=>a+m[s],0)),all=tot.reduce((a,b)=>a+b,0);
 const ex=Object.values(PL).flat().map(a=>a[0]),by={};D.forEach(x=>(by[x.n]??=[]).push(x));
 const prog=ex.filter(n=>by[n]).map(n=>{const a=by[n],f=a[0],l=a[a.length-1];return{n,t:a.length,f,l,ch:l.w-f.w,hv:Math.max(...a.map(x=>x.mx))}});
 const up=prog.filter(p=>p.ch>0).length,mxv=Math.max(1,...mo.map(m=>SP.reduce((a,s)=>a+m[s],0)));
 const now=new Date(),j=new Date(yr,0,1,12),m0=new Date(j);m0.setDate(j.getDate()-((j.getDay()+6)%7));
 const wk=d=>Math.floor(Math.round((new Date(d+'T12:00')-m0)/864e5)/7),N=wk(yr+'-12-31')+1;
 const last=yr==now.getFullYear()?wk(iso(now)):yr<now.getFullYear()?N-1:-1;
 const A=by[exSel]||[],wm={},pts=[];let prev=null;
 A.forEach(x=>{const w=wk(x.d);wm[w]=Math.max(wm[w]??0,x.mx)});
 for(let w=0;w<=last;w++){const r=wm[w]!=null;if(r)prev=wm[w];pts.push({v:prev,r})}
 const vals=pts.map(p=>p.v).filter(v=>v!=null),lo=vals.length?Math.min(...vals):0,hi=vals.length?Math.max(...vals):1,pad=Math.max((hi-lo)*.2,2),y0=Math.max(0,lo-pad),y1=hi+pad;
 const X=w=>50+w*(535/Math.max(1,N-1)),Y=v=>220-(v-y0)/(y1-y0)*190;
 let svg=`<svg viewBox="0 0 600 260" role=img aria-label="Heaviest set by week">`;
 [0,1,2,3].forEach(i=>{const v=y0+(y1-y0)*i/3,y=Y(v);svg+=`<line x1=50 x2=585 y1=${y} y2=${y} stroke="var(--line)"/><text x=44 y=${y+4} text-anchor=end font-size=11 fill="var(--mute)">${Math.round(v*10)/10}</text>`});
 MN.forEach((m,i)=>svg+=`<text x=${X(wk(yr+'-'+String(i+1).padStart(2,'0')+'-01'))} y=244 text-anchor=middle font-size=11 fill="var(--mute)">${m}</text>`);
 const pp=pts.map((p,w)=>p.v==null?null:{x:X(w),y:Y(p.v),v:p.v,r:p.r}).filter(Boolean);
 if(pp.length){let sh=null;svg+=`<polyline fill=none stroke="var(--Pull)" stroke-width=3 stroke-linejoin=round points="${pp.map(p=>p.x+','+p.y).join(' ')}"/>`+pp.map(p=>{if(!p.r)return'';const t=p.v!==sh?`<text x=${p.x} y=${p.y-9} text-anchor=middle font-size=10 fill="var(--ink)">${p.v}</text>`:'';sh=p.v;return`<circle cx=${p.x} cy=${p.y} r=3.5 fill="var(--Pull)"/>`+t}).join('')}
 else svg+=`<text x=320 y=130 text-anchor=middle fill="var(--mute)">No weights typed for this exercise in ${yr} yet</text>`;
 svg+='</svg>';
 const f=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
 return `<div class=card><div class=pick><label for=ys style="font-weight:600">Year</label><select id=ys>${[yr-1,yr,yr+1].map(y=>`<option ${y==yr?'selected':''}>${y}</option>`).join('')}</select></div></div>
 <div class=tiles><div class=tile><b>${all}</b><i>Workouts logged</i></div>${SP.map((s,i)=>`<div class=tile style="--c:var(--${s})"><b>${tot[i]}</b><i>${s}</i></div>`).join('')}<div class=tile><b>${up}</b><i>Lifts up</i></div></div>
 <div class=card><h2>Workouts per month</h2><div class=bars>${mo.map((m,i)=>`<div title="${MN[i]}">${SP.map(s=>m[s]?`<em style="height:${m[s]/mxv*100}%;background:var(--${s})"></em>`:'').join('')}<span>${MN[i][0]}</span></div>`).join('')}</div></div>
 <div class=card><h2>Weight over time</h2><select id=xs style="width:100%;margin-bottom:8px">${ex.map(n=>`<option ${n==exSel?'selected':''}>${n}</option>`).join('')}</select>${svg}<div class=sync>Heaviest set each week. Weeks you skip carry your last weight forward.</div></div>
 <div class=card><h2>Exercise progress</h2>${prog.length?`<div class=scroll><table><tr><th>Exercise<th>Times<th>First<th>Latest<th>Change<th>Heaviest</tr>${prog.map(p=>`<tr><td>${p.n}<td>${p.t}<td>${p.f.w} (${f(p.f.d)})<td>${p.l.w} (${f(p.l.d)})<td class="${p.ch>0?'up':p.ch<0?'dn':''}">${p.ch>0?'+':''}${p.ch}<td>${p.hv}</tr>`).join('')}</table></div>`:`<div class=empty>Type a Set 1 weight in the Log and your progress shows up here.</div>`}</div>`}
function render(){const a=document.activeElement&&document.activeElement.id;
 $('#app').innerHTML=tab=='log'?renderLog():renderYr();$('#tLog').classList.toggle('on',tab=='log');$('#tYr').classList.toggle('on',tab=='yr')}
$('#tLog').onclick=()=>{tab='log';render()};$('#tYr').onclick=()=>{tab='yr';render()};
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='pv')shift(-1);else if(b.id=='nx')shift(1);else if(b.id=='td')setDay(iso(new Date()));else if(b.dataset.sp){cur.sp=b.dataset.sp;render()}});
$('#app').addEventListener('change',e=>{const t=e.target;if(t.id=='dt'&&t.value)setDay(t.value);else if(t.id=='ys'){yr=+t.value;render()}else if(t.id=='xs'){exSel=t.value;render()}});
$('#app').addEventListener('input',e=>{const t=e.target;if(!t.dataset.n)return;put(t.dataset.n,t.dataset.k,+t.dataset.i,t.value);
 const s=$('#st');if(s)s.textContent=logged(cur.d,cur.sp)?'✔ Logged':'Not logged yet';syncMsg='';save()});
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),db=await claude.use('db');if(!u||!db)return;
 const id=await u.id();ref=db.collection('data/users/'+id).doc('log');const s=await ref.get();
 if(s.exists&&s.data().json){const r=JSON.parse(s.data().json);if(r&&r.logs){S=r;try{localStorage.setItem('kim',JSON.stringify(S))}catch(e){}}}
 else if(Object.keys(S.logs).length)save();
 syncMsg='Synced to your account';render()}catch(e){}})();
</script></body></html>
